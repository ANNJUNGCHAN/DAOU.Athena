<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">관심과 확인된 투자 사실</title>
  <desc id="desc">대화의 배당 관심과 계좌 제공자가 확인한 구조화된 보유 입력을 별도 출처로 저장합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#576AF9"/></marker></defs>
  <rect width="1200" height="400" fill="#fff"/>
  <text x="50" y="65" font-family="Daki,DakiL,sans-serif" font-size="24" fill="#14171D">관심과 확인된 투자 사실</text>
  <g class="step" style="animation-delay:0s" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><rect x="55" y="130" width="230" height="140" rx="8" fill="#FAFAFC" stroke="#263044" stroke-width="1.5"/><text x="170" y="183" font-size="20" fill="#14171D">대화 원문</text><text x="170" y="220" font-size="17" fill="#626B76">배당이 궁금해요</text></g>
  <g class="step" style="animation-delay:0.3s" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><rect x="335" y="130" width="230" height="140" rx="8" fill="#FAFAFC" stroke="#263044" stroke-width="1.5"/><text x="450" y="183" font-size="20" fill="#14171D">관심 기록</text><text x="450" y="220" font-size="17" fill="#626B76">대화 ID · 추출 상태</text></g>
  <g class="step" style="animation-delay:0.6s" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><rect x="615" y="130" width="230" height="140" rx="8" fill="#EEF0FF" stroke="#576AF9" stroke-width="1.5"/><text x="730" y="183" font-size="20" fill="#14171D">확인된 보유 입력</text><text x="730" y="220" font-size="17" fill="#626B76">종목 · 계정 · 수량 10주</text></g>
  <g class="step" style="animation-delay:0.8999999999999999s" font-family="Daki,DakiL,sans-serif" text-anchor="middle"><rect x="895" y="130" width="230" height="140" rx="8" fill="#FAFAFC" stroke="#263044" stroke-width="1.5"/><text x="1010" y="183" font-size="20" fill="#14171D">보유 기록</text><text x="1010" y="220" font-size="17" fill="#626B76">보유 ID · 출처 · 시점</text></g>
  <path d="M285 200H355" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M845 200H915" fill="none" stroke="#576AF9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="50" y="335" font-family="Daki,DakiL,sans-serif" font-size="17" fill="#626B76">대화에서 10주를 샀다고 말해도 계좌에서 확인된 보유 사실로 바꾸지 않습니다.</text>
  <style>.step{animation:emphasis 5s ease-in-out infinite}@keyframes emphasis{0%,100%{opacity:1}50%{opacity:.72}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style>
</svg>
