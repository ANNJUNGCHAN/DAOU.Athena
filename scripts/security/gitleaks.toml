title = "Athena repository secret policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "athena-account-number"
description = "Korean or English account label followed by a full account identifier"
regex = '''(?i)(?:계좌(?:번호)?|account(?:[_ -]?number)?)[ \t]*["'`]?[]})]?[ \t]*(?::|=|->)?[ \t]*["'`]?([0-9]{8}(?:-[0-9]{2})?)'''
secretGroup = 1
keywords = ["계좌", "account"]
tags = ["account", "athena"]

[[rules]]
id = "athena-auth-key"
description = "Authentication key assignment with a provider credential value"
regex = '''(?i)(?:auth[_-]?key|인증키)[^A-Za-z0-9\r\n]{0,32}([A-Za-z0-9][A-Za-z0-9_./+=:-]{15,})'''
secretGroup = 1
keywords = ["auth_key", "auth-key", "authkey", "인증키"]
tags = ["api", "athena"]

[[allowlists]]
description = "Reviewed account fixtures at their exact source paths"
targetRules = ["athena-account-number"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''(?:^|/)app/lib/canvas-tabs\.test\.js$''',
  '''(?:^|/)app/lib/main/accounts\.test\.js$''',
  '''(?:^|/)app/lib/main/board-hydrate\.test\.js$''',
  '''(?:^|/)app/lib/paper-screen-routes\.js$''',
  '''(?:^|/)backend/tests/api/test_canvas_render_plan\.py$''',
  '''(?:^|/)backend/tests/mcp/test_consent\.py$''',
]
regexes = [
  '''^11111111-11$''',
  '''^12345678$''',
  '''^22222222-22$''',
  '''^80123447$''',
  '''^81234721$''',
]

[[allowlists]]
description = "Reviewed non-secret fixtures and content hashes at their exact source paths"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''(?:^|/)app/data/wide-table-fold-fixtures\.json$''',
  '''(?:^|/)app/probe-krx-live\.js$''',
  '''(?:^|/)app/verify-settings\.js$''',
  '''(?:^|/)backend/tests/unit/test_logging_config\.py$''',
  '''(?:^|/)docs/handoff/2026-09-07-grok-build/evidence/paper-audit-a\.json$''',
  '''(?:^|/)docs/handoff/2026-09-07-paper-parity/tasks/tasks-paper-gates\.json$''',
  '''(?:^|/)docs/handoff/2026-09-07-paper-parity/tasks/tasks-paper-implement-b\.json$''',
  '''(?:^|/)scripts/market-session-audit/custom-read-sweep\.mjs$''',
  '''(?:^|/)spike/krx-probe/step1_auth_probe\.py$''',
]
regexes = [
  '''^a874866597b590fb5de4149d8314635b2dec528ca1913839a4011bd89284dfdc$''',
  '''^b8549d2df3960b89d88b303491859ba04b9701ea7c70d7bf9dd95ebf2f69a39a$''',
  '''^ca313038de0a8360c3547f2dad7848a7b3d6a6cb898c7abb1405263f3db9042c$''',
  '''^feat-432Z-1-proposal-turns$''',
  '''^gate-7-8-phrases-routes$''',
  '''^INVALID_TEST_KEY_12345$''',
  '''^kiwoom-secret-key-qrstuvwxyz0123$''',
  '''^tok-9f3c1a2b$''',
  '''^VERIFY_OK_SECRET_0123456789$''',
  '''^xraymont_cntr_qty_profa_100tp$''',
]
