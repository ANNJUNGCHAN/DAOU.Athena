title = "Athena presentation public repository secret policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "athena-account-number"
description = "Korean or English account label followed by a full account identifier"
regex = '''(?i)(?:계좌(?:번호)?|account(?:[_ -]?number)?)[ \t]*["'`]?[]})]?[ \t]*(?::|=|->)?[ \t]*["'`]?([0-9]{4}-?[0-9]{4}(?:-[0-9]{2})?)'''
secretGroup = 1
keywords = ["계좌", "account"]
tags = ["account", "athena"]

[[rules]]
id = "athena-auth-key"
description = "Authentication key assignment with a provider credential value"
regex = '''(?i)(?:auth[_-]?key|인증키)[^A-Za-z0-9\r\n]{0,32}([A-Za-z0-9][A-Za-z0-9_./+=:-]{15,})'''
secretGroup = 1
keywords = ["auth_key", "auth-key", "authkey", "인증키"]
tags = ["api", "athena"]
