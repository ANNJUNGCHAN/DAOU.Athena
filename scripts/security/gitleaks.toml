title = "Athena presentation public repository secret policy"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Known agent trace identity hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|[\\/])\.omc[\\/]state[\\/]session-end-jobs[\\/]339213d5-e65b-4fdd-9d86-57cc2c51e395\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:scopeKey|intentKey|idempotencyKey)"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Known browser trace public offer identifier"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|[\\/])\.playwright-mcp[\\/]page-2026-10-14T16-22-10-144Z\.yml$''']
regexTarget = "match"
regexes = ['''(?i)offerKey=[A-Za-z_][A-Za-z0-9_]{18}(?:[&\s"']|$)''']

[[allowlists]]
description = "Exact SHA-256 provenance field, not a Discord credential"
targetRules = ["discord-api-token"]
condition = "AND"
paths = ['''(?:^|[\\/])최종[\\/]기능축소[\\/]경영진심사[\\/]최종본[\\/]_work[\\/]rehearsal-20261015[\\/]plugin-video[\\/]build-receipt\.json$''']
regexTarget = "line"
regexes = ['''^\s*"discordSourceSha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[rules]]
id = "athena-account-number"
description = "Korean or English account label followed by a full account identifier"
regex = '''(?i)(?:계좌(?:번호)?|account(?:[_ -]?number)?)[ \t]*["'`]?[]})]?[ \t]*(?::|=|->)?[ \t]*["'`]?([0-9]{4}-?[0-9]{4}(?:-[0-9]{2})?)'''
secretGroup = 1
keywords = ["계좌", "account"]
tags = ["account", "athena"]

[[rules]]
id = "athena-auth-key"
description = "Authentication key assignment with a provider credential value"
regex = '''(?i)(?:auth[_-]?key|인증키)[^A-Za-z0-9\r\n]{0,32}([A-Za-z0-9][A-Za-z0-9_./+=:-]{15,})'''
secretGroup = 1
keywords = ["auth_key", "auth-key", "authkey", "인증키"]
tags = ["api", "athena"]
