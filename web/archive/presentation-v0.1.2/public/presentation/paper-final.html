<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ATHENA 온라인 예선 발표 자료</title>
  <link rel="stylesheet" href="paper-final.css">
</head>
<body>
  <main id="paperDeck" class="paper-deck" aria-label="ATHENA 최종 발표">
    <div id="paperViewport" class="paper-viewport">
      <div id="paperStage" class="paper-stage" aria-live="polite"></div>
    </div>

    <nav id="paperControls" class="paper-controls" aria-label="발표 조작">
      <button id="prevSlide" type="button" aria-label="이전 슬라이드">‹</button>
      <button id="openToc" type="button" aria-label="목차 열기"><span id="slideCounter">1 / 34</span></button>
      <button id="replaySlide" type="button" aria-label="현재 장면 다시 재생">↻</button>
      <button id="openPrompter" type="button" aria-label="발표 시작">발표 시작</button>
      <button id="toggleFullscreen" type="button" aria-label="전체 화면">전체 화면</button>
      <button id="nextSlide" type="button" aria-label="다음 슬라이드">›</button>
    </nav>

    <dialog id="tocDialog" class="paper-toc">
      <form method="dialog" class="paper-toc-head"><strong>ATHENA 최종 발표</strong><button aria-label="목차 닫기">닫기</button></form>
      <ol id="tocList"></ol>
    </dialog>
  </main>

  <script src="paper-final-content.js"></script>
  <script src="paper-final.js"></script>
  <script src="paper-sync.js"></script>
</body>
</html>
